overrides:
  minimatch: '^11.0.8'
  glob: '>=10.5.0'
  # Typography still pins 6.0.10; use the fix for GHSA-rj75-hqrm-r3gf.
  '@tailwindcss/typography>postcss-selector-parser': '^7.1.6'

minimumReleaseAgeExclude:
  - bwh-auth
  - react-hook-form@7.90.0

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  bwh-auth: true
  esbuild: true
  spotlight-noindex: true
  unrs-resolver: true

# Repair prototype assignment in the actual Jest consumer; retain the upstream version.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge-4.3.1.patch
