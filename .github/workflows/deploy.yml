name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist &
          PID1=$!
          pnpm install --frozen-lockfile &
          PID2=$!
          wait $PID1; E1=$?
          wait $PID2; E2=$?
          test $E1 -eq 0 -a $E2 -eq 0

      - name: Build frontend
        run: pnpm run build

      - name: Prepare PHP environment
        run: cp .env.example .env && php artisan key:generate

      - name: Run all checks
        run: |
          pnpm exec concurrently --kill-others-on-fail \
            "pnpm run type-check" \
            "pnpm run lint" \
            "pnpm run test" \
            "vendor/bin/paratest --processes=auto"

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: test
    environment: prod

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Append to .htaccess
        run: cat htaccess-append.txt >> public/.htaccess

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -av --delete --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/laravel-spgp/

      - name: Run artisan tasks and activate document root
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" 'bash -se' <<'REMOTE'
          set -eu
          cd "$HOME/laravel-spgp"
          /opt/cpanel/ea-php85/root/usr/bin/php artisan config:clear
          /opt/cpanel/ea-php85/root/usr/bin/php artisan config:cache
          /opt/cpanel/ea-php85/root/usr/bin/php artisan migrate --force

          cd "$HOME"
          rm -rf -- spgp.vxcv.com web
          ln -s "$HOME/laravel-spgp/public" "$HOME/spgp.vxcv.com"
          ln -s "$HOME/laravel-spgp/public" "$HOME/web"
          test -L "$HOME/spgp.vxcv.com"
          test -f "$HOME/spgp.vxcv.com/index.php"
          REMOTE

      - name: Verify production response
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 5 --retry-connrefused \
            --max-time 30 https://spgp.vxcv.com/ > /tmp/spgp-index.html
          ! grep -q 'Index of /' /tmp/spgp-index.html
          grep -qi 'login' /tmp/spgp-index.html
