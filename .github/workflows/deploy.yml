name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        timeout-minutes: 4
        run: |
          composer install --no-interaction --prefer-dist &
          composer_pid=$!
          pnpm install --frozen-lockfile &
          pnpm_pid=$!
          composer_status=0
          pnpm_status=0
          wait "$composer_pid" || composer_status=$?
          wait "$pnpm_pid" || pnpm_status=$?
          test "$composer_status" -eq 0 && test "$pnpm_status" -eq 0

      - name: Build frontend
        run: pnpm run build

      - name: Prepare PHP environment
        run: cp .env.example .env && php artisan key:generate --no-interaction --force

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

      - name: Run all checks
        timeout-minutes: 6
        run: |
          pnpm exec concurrently --kill-others-on-fail \
            "pnpm run type-check" \
            "pnpm run lint" \
            "pnpm run test" \
            "vendor/bin/paratest --processes=auto"

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: test
    environment: prod
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Append to .htaccess
        run: cat htaccess-append.txt >> public/.htaccess

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Every ssh connection, including rsync's transport, sends keepalives so a
      # long quiet stretch (a slow migration, a large transfer) is not dropped by
      # an idle-timeout middlebox partway through the deploy.
      - name: Deploy with rsync
        run: |
          rsync -av --delete --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/laravel-spgp/

      - name: Run artisan tasks and activate document root
        run: |
          ssh -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" 'bash -se' <<'REMOTE'
          set -eu
          cd "$HOME/laravel-spgp"
          PHP_BIN=/opt/cpanel/ea-php85/root/usr/bin/php
          test -x "$PHP_BIN"
          test "$("$PHP_BIN" -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.5"
          "$PHP_BIN" artisan config:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan migrate --force

          cd "$HOME"
          rm -rf -- spgp.vxcv.com web
          ln -s "$HOME/laravel-spgp/public" "$HOME/spgp.vxcv.com"
          ln -s "$HOME/laravel-spgp/public" "$HOME/web"
          test -L "$HOME/spgp.vxcv.com"
          test -f "$HOME/spgp.vxcv.com/index.php"
          test -f "$HOME/spgp.vxcv.com/.htaccess"
          grep -Fq 'AddHandler application/x-httpd-ea-php85 .php .php8 .phtml' "$HOME/spgp.vxcv.com/.htaccess"
          REMOTE

      - name: Verify production response
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 5 --retry-connrefused \
            --max-time 30 https://spgp.vxcv.com/ > /tmp/spgp-index.html
          # Not `! grep`: under bash -e a negated command never fails the step.
          if grep -q 'Index of /' /tmp/spgp-index.html; then
            echo '::error::Production serves a directory listing instead of the application.'
            exit 1
          fi
          grep -qi 'login' /tmp/spgp-index.html
